services:
  kpi-dashboard:
    build: .
    restart: unless-stopped
    environment:
      # Coolify: routes the generated domain to port 3000.
      - SERVICE_FQDN_KPI_3000
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USERNAME=${ODOO_USERNAME}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
      - AUTH_EMAIL=${AUTH_EMAIL}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - AUTH_SECRET=${AUTH_SECRET}
    volumes:
      # Named volume: seeded from the image's data/ on first start, then keeps
      # sales-targets.json and admin-data.json across redeploys.
      - kpi-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kpi-data:
